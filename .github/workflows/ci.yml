name: Build and publish StateFlow

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Build and test library and demo
        run: mvn -B -ntp verify

      - name: Upload library JAR
        uses: actions/upload-artifact@v4
        with:
          name: vaadin-stateflow
          path: vaadin-stateflow/target/*.jar
          if-no-files-found: error
          retention-days: 7

      - name: Publish library and parent POM to GitHub Packages
        if: github.event_name != 'pull_request'
        run: mvn -B -ntp -pl vaadin-stateflow -am deploy -DskipTests
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
